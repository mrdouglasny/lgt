status:
  scope: >
    Formalization of the d ≥ 2 lattice Yang–Mills mass gap at strong coupling
    for U(n) Wilson lattice gauge theory on (ℤ/Nℤ)^d (d ≥ 2, N ≥ 3, n ≥ 1),
    via the Dobrushin uniqueness method (Chatterjee, Ch. 16). Establishes
    exponential decay of the connected 2-point function of Wilson plaquette
    observables for coupling β < 1/(32 n (d−1)). Includes: Wilson action and its
    gauge invariance; the YM probability measure (product Haar + Boltzmann
    weight, Z > 0); the Gibbs specification framework with the DLR identity and
    Dobrushin-condition verification at strong coupling; U(n) instances with
    trace bounds; periodic-torus link-graph distance machinery; and an
    independent EKR/tensor-RG-to-Dobrushin bridge yielding correlation decay for
    general nearest-neighbor spin models. NOT fully covered: the 2D Doeblin path
    (MassGap2D.lean) and several fields of the RG scale-transfer bridge remain
    stated as hypotheses.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []                   # no project axioms; only Lean foundationals (propext, Classical.choice, Quot.sound)
  main_results:
    - declaration: "ym_mass_gap_strong_coupling"
      file: "LGT/MassGap/StrongCoupling.lean"
      sorry_count: 0
      axioms: []
      literature_dependencies:
        - statement: "strong-coupling exponential correlation decay via Dobrushin uniqueness (distance-parameterised wrapper)"
          source: "URL:https://souravchatterjee.su.domains/"
    - declaration: "ym_mass_gap_exponential_decay"
      file: "LGT/MassGap/StrongCoupling.lean"
      sorry_count: 0
      axioms: []
      literature_dependencies:
        - statement: "algebraic (geometric) decay of the connected 2-point function of Wilson plaquette observables on (ℤ/Nℤ)^d for U(n) at β < 1/(32n(d−1))"
          source: "URL:https://souravchatterjee.su.domains/"
        - statement: "Wilson lattice gauge action and plaquette observables"
          source: "10.1103/PhysRevD.10.2445"
    - declaration: "ym_mass_gap_rate_exists"
      file: "LGT/MassGap/StrongCoupling.lean"
      sorry_count: 0
      axioms: []
      literature_dependencies:
        - statement: "existence of a mass m = (−log α)/2 > 0 with exp(−m·plaqDist) decay (canonical mass-gap form)"
          source: "URL:https://souravchatterjee.su.domains/"
    - declaration: "ekr_to_mass_gap"
