          source: "ISBN:978-3-11-025029-9"

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-4-8"]
      framework: "Claude Code"
      tool_setup: "lake build; cycle-by-cycle proving with compiler-guided repair."
      prompting_notes: >
        Primary (and sole) prover. Commit co-author trailers span Claude Opus
        4.6 / 4.7 / 4.8 (1M context) across the project's history.
  notes: >
    Only Claude was used as a prover. Codex and Gemini appear in commit bodies
    and docs/codex-review*.txt strictly as code/math reviewers, not as
    autoformalization agents; AGENTS.md is a generic project-overview file (not a
    Codex agent configuration) and there is no GEMINI.md, so neither is listed as
    an automation method.

fidelity:
  divergences: >
    Generalized from the d=2 Doeblin target to a d ≥ 2 (N ≥ 3) strong-coupling
    result via Dobrushin uniqueness. The link distance in the wrapper is an
    abstract parameter satisfying refl/triangle/nearest-neighbor support,
    instantiated to the periodic shared-plaquette link-graph distance for the
    headline theorems. Decay is proved in the periodic L¹ plaquette distance with
    a forced factor of 1/2 in the rate. Stated for U(n); general compact G ⊆ U(n)
    requires a `HasGaugeTrace` instance. Much of the Dobrushin/coupling machinery
    is supplied by the sibling markov-semigroups library.

